version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Don't raise PRs for releases younger than this many days, to dodge a
    # freshly-poisoned version that gets yanked within hours or days.
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # the semver-*-days keys are ignored for gomod

  # The Traefik image the shared proxy runs, pinned by version and digest in
  # internal/bothy/proxy-compose.yml. Nothing tests the proxy in CI, so try
  # `bothy start` with the new image before merging one of these.
  - package-ecosystem: docker-compose
    directory: "/internal/bothy"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
