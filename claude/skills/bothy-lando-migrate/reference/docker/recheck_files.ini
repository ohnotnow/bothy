; From the bothy-lando-migrate skill, reference set 1.
; For the dev and ci (QA) builds only: see the Dockerfile.
; custom_php.ini tells opcache never to look at a file again once it has been
; compiled, which is right for production.  This turns the check back on, so
; an edited file takes effect on the next request.  The file name starts with
; zz so php reads it after custom_php.ini.

[opcache]
opcache.validate_timestamps=1
opcache.revalidate_freq=0
