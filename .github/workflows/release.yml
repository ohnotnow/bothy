name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload the binaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true

      - name: Build binaries
        # macOS is the tested platform; the Linux builds are untested
        run: |
          LDFLAGS="-s -w -X github.com/ohnotnow/bothy/internal/bothy.Version=${GITHUB_REF_NAME}"
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/bothy-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/bothy-darwin-arm64 .
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/bothy-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/bothy-linux-arm64 .

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
